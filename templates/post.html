<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | Taipreneur</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://taipreneur.com/{{slug}}">
<meta property="og:type" content="article">
<meta property="og:url" content="https://taipreneur.com/{{slug}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:site_name" content="Taipreneur">
<meta property="article:published_time" content="{{date}}">
<meta name="twitter:card" content="summary">
<meta name="author" content="Abhay Tai">
<link rel="icon" href="/img/logo1.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: single article column with site bar; matches /blog */
:root{
  --bg:#f7f9fb; --surface:#ffffff; --fg:#13202b; --muted:#5a6b78; --line:#dbe3ea;
  --red:#e02424; --blue:#2a9fe6; --tag-bg:#e4f2fc; --code-bg:#eef3f7;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e151b; --surface:#151f28; --fg:#e4edf3; --muted:#93a4b1; --line:#24323d;
  --red:#ff5a5a; --blue:#5bb8f2; --tag-bg:#16303f; --code-bg:#1a2833; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 var(--f-body);padding-inline:16px;padding-block:0 72px}
.wrap{max-width:720px;margin:0 auto}
.sitebar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{font:800 17px var(--f-display);letter-spacing:.04em;text-decoration:none}
.brand .t{color:var(--red)}.brand .p{color:var(--blue)}
.sitebar nav{display:flex;gap:16px}
.sitebar nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:13px}
.sitebar nav a:hover,.sitebar nav a:focus-visible{color:var(--fg)}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font:500 12px var(--f-mono);color:var(--muted);margin-top:48px}
.tag{background:var(--tag-bg);color:var(--blue);padding:3px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
h1{font:800 clamp(30px,6vw,46px)/1.1 var(--f-display);letter-spacing:-.02em;margin:12px 0 14px;text-wrap:balance}
.lede{color:var(--muted);font-size:19px;margin:0 0 32px}
article h2{font:700 26px/1.25 var(--f-display);margin:40px 0 10px;text-wrap:balance}
article h3{font:600 20px/1.3 var(--f-display);margin:28px 0 8px}
article p,article li{max-width:68ch}
article a{color:var(--blue)}
article code{font:14px var(--f-mono);background:var(--code-bg);padding:1px 5px;border-radius:3px}
article pre{font:14px/1.55 var(--f-mono);background:var(--code-bg);padding:14px 16px;border-radius:6px;overflow-x:auto}
article pre code{background:none;padding:0}
article img{max-width:100%;height:auto;border-radius:6px}
article blockquote{margin:20px 0;padding-left:16px;border-left:3px solid var(--blue);color:var(--muted)}
footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <div class="sitebar">
    <a class="brand" href="/"><span class="t">TAI</span><span class="p">PRENEUR</span></a>
    <nav aria-label="Site"><a href="/blog">Blog</a><a href="/">Home</a></nav>
  </div>

  <div class="meta"><span class="tag">{{tag}}</span><time datetime="{{date}}">{{date_display}}</time></div>
  <h1>{{title}}</h1>
  <p class="lede">{{description}}</p>

  <article>
<!-- POST BODY: write the article here (h2, p, ul, pre, img) -->
  </article>

  <footer>Written by Abhay Tai · <a href="/blog">More from the Taipreneur blog</a></footer>
</div>
</body>
</html>
