<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | Taipreneur</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://taipreneur.com/{{slug}}">
<meta property="og:type" content="article">
<meta property="og:url" content="https://taipreneur.com/{{slug}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:site_name" content="Taipreneur">
<meta property="article:published_time" content="{{date}}">
<meta name="twitter:card" content="summary">
<meta name="author" content="Abhay Tai">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/img/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: single article column with site bar; matches /blog. Components: .takeaways, figure.diagram, .example, .note, table, .credit */
:root{
  --bg:#f7f9fb; --surface:#ffffff; --fg:#13202b; --muted:#5a6b78; --line:#dbe3ea;
  --red:#e02424; --blue:#2a9fe6; --tag-bg:#e4f2fc; --code-bg:#eef3f7;
  --good:#16865a; --good-bg:#e3f4ec; --warn:#b4570b; --warn-bg:#fbefe2;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e151b; --surface:#151f28; --fg:#e4edf3; --muted:#93a4b1; --line:#2a3946;
  --red:#ff5a5a; --blue:#5bb8f2; --tag-bg:#16303f; --code-bg:#1a2833;
  --good:#4cc792; --good-bg:#14302a; --warn:#f0a65a; --warn-bg:#33261a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 var(--f-body);padding-inline:16px;padding-block:0 72px}
.wrap{max-width:720px;margin:0 auto}
.sitebar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{font:800 17px var(--f-display);letter-spacing:.04em;text-decoration:none}
.brand .t{color:var(--red)}.brand .p{color:var(--blue)}
.sitebar nav{display:flex;gap:16px}
.sitebar nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:13px}
.sitebar nav a:hover,.sitebar nav a:focus-visible{color:var(--fg)}
.crumbs{margin-top:36px;font:500 13px var(--f-body);color:var(--muted)}
.crumbs a{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font:500 12px var(--f-mono);color:var(--muted);margin-top:12px}
.tag{background:var(--tag-bg);color:var(--blue);padding:3px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
h1{font:800 clamp(30px,6vw,46px)/1.1 var(--f-display);letter-spacing:-.02em;margin:12px 0 14px;text-wrap:balance}
.lede{color:var(--muted);font-size:19px;margin:0 0 28px}
article h2{font:700 26px/1.25 var(--f-display);margin:44px 0 10px;text-wrap:balance}
article h3{font:600 20px/1.3 var(--f-display);margin:28px 0 8px}
article p,article li{max-width:68ch}
article li{margin:4px 0}
article a{color:var(--blue)}
article code{font:14px var(--f-mono);background:var(--code-bg);padding:1px 5px;border-radius:3px}
article pre{font:14px/1.55 var(--f-mono);background:var(--code-bg);padding:14px 16px;border-radius:6px;overflow-x:auto}
article pre code{background:none;padding:0}
article img{max-width:100%;height:auto;border-radius:6px}
article blockquote{margin:20px 0;padding-left:16px;border-left:3px solid var(--blue);color:var(--muted);font-style:italic}
/* Key takeaways: first thing in the article on posts over ~800 words */
.takeaways{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin:0 0 32px}
.takeaways b.h{display:block;font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.takeaways ul{margin:0;padding-left:20px}
/* Diagrams: inline SVG; use classes below so colours follow light/dark */
figure.diagram{margin:24px 0 28px}
figure.diagram .box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto}
/* Draw diagrams on a 440-unit-wide viewBox with 14–17px text: readable on phones, not oversized on desktop */
figure.diagram svg{display:block;width:100%;max-width:520px;min-width:280px;height:auto;margin:0 auto;font-family:var(--f-body)}
figure.diagram figcaption{font-size:14px;color:var(--muted);margin-top:8px}
.d-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.d-accent{stroke:var(--blue);stroke-width:2.5;fill:none}
.d-box{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.d-fill{fill:var(--tag-bg);stroke:var(--blue);stroke-width:1.5}
.d-good{fill:var(--good-bg);stroke:var(--good);stroke-width:1.5}
.d-warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.5}
.d-text{fill:var(--fg);font-size:15px}
.d-bold{fill:var(--fg);font-size:16px;font-weight:600}
.d-muted{fill:var(--muted);font-size:14px}
.d-blue{fill:var(--blue)}
/* Example and note boxes */
.example{border-left:3px solid var(--good);background:var(--good-bg);padding:12px 16px;border-radius:0 6px 6px 0;margin:18px 0}
.example b.h,.note b.h{display:block;font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.example b.h{color:var(--good)}
.note{border-left:3px solid var(--warn);background:var(--warn-bg);padding:12px 16px;border-radius:0 6px 6px 0;margin:18px 0}
.note b.h{color:var(--warn)}
.example p,.note p{margin:4px 0}
.tbl{overflow-x:auto;margin:16px 0 22px}
article table{border-collapse:collapse;width:100%;min-width:420px;font-size:15px}
article th,article td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
article th{font:600 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.credit{margin-top:40px;padding:14px 18px;border:1px solid var(--line);border-radius:8px;font-size:15px;color:var(--muted)}
.credit a{color:var(--blue)}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <div class="sitebar">
    <a class="brand" href="/"><span class="t">TAI</span><span class="p">PRENEUR</span></a>
    <nav aria-label="Site"><a href="/blog">Blog</a><a href="/">Home</a></nav>
  </div>

  <div class="crumbs"><a href="/blog">Blog</a> / {{tag}}</div>
  <div class="meta"><span class="tag">{{tag}}</span><time datetime="{{date}}">{{date_display}}</time><!-- readtime:start --><!-- readtime:end --></div>
  <h1>{{title}}</h1>
  <p class="lede">{{description}}</p>

  <article>
<!--
  Write the post here. Rules: content/blog-rules.md. Building blocks:

  <div class="takeaways"><b class="h">Key takeaways</b><ul><li>…</li></ul></div>

  <figure class="diagram">
    <div class="box"><svg viewBox="0 0 440 120" role="img" aria-label="ALT TEXT">
      <rect class="d-box" x="20" y="30" width="160" height="60" rx="8"/>
      <text class="d-bold" x="100" y="66" text-anchor="middle">Label</text>
    </svg></div>
    <figcaption>What the reader should notice.</figcaption>
  </figure>

  <div class="example"><b class="h">Example</b><p>…</p></div>
  <div class="note"><b class="h">Watch out</b><p>…</p></div>
  <div class="tbl"><table>…</table></div>
  Images: put files in public/blog/img/{{slug}}/ and use <img src="/blog/img/{{slug}}/name.jpg" alt="…">

  <div class="credit">Credit: … </div>
-->
  </article>

  <footer>Written by Abhay Tai · <a href="/blog">More from the Taipreneur blog</a></footer>
</div>
<script src="/js/tai-lead.js" defer data-popup="off"></script>
</body>
</html>
